# Provided: Postgres, pre-seeded with the baseline schema.
# You add the `app` service once you've written the Dockerfile, so that
# `docker compose up` brings up the whole thing.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot migration job: same image as the app, runs before the app starts.
  # Mirrors production, where this is an Azure Container Apps Job / k8s Job that
  # must succeed before the new revision takes traffic.
  migrate:
    build: .
    image: orders-api:local
    command: ["python", "migrations/migrate.py", "up"]
    environment:
      DB_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: orders-api:local
    environment:
      DB_URL: postgresql://app:app@db:5432/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Runtime hardening: immutable filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
