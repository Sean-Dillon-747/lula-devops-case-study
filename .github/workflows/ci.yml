# CI/CD: build -> test migration safety -> "deploy" (migrate the ephemeral Postgres) -> smoke test.
# The postgres service container stands in for the production database.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: postgresql://app:app@localhost:5432/app
      PGPASSWORD: app
      IMAGE: orders-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Each test resets the DB to the baseline and exercises one safety property:
      # old app works at every stage, crash mid-backfill -> detect -> recover forward,
      # unknown statuses block NOT NULL, concurrent runner refused, full down/up.
      - name: Migration safety tests
        run: pytest -v tests

      # ---- "Deploy": what a real release does against the production database ----
      - name: Reset DB to the production-like baseline
        run: |
          psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -c "
            INSERT INTO orders (amount, status)
            SELECT (random()*1000)::numeric(12,2), (ARRAY['pending','paid','shipped'])[1 + floor(random()*3)::int]
            FROM generate_series(1, 50000);"

      - name: Start current app version (simulates live traffic during the migration)
        run: |
          docker run -d --name app --network host -e DB_URL="$DB_URL" "$IMAGE"
          for i in $(seq 1 30); do curl -fsS localhost:8000/readyz && break; sleep 1; done
          curl -fsS localhost:8000/readyz

      - name: Run migrations with live writes in parallel
        run: |
          ( for i in $(seq 1 200); do
              curl -fsS -X POST localhost:8000/orders -H 'content-type: application/json' \
                -d '{"amount": 10, "status": "paid"}' > /dev/null || echo "WRITE FAILED" >> writes.log
            done ) &
          WRITER=$!
          python migrations/migrate.py up
          wait $WRITER
          if [ -f writes.log ]; then cat writes.log; echo "::error::app writes failed during migration"; exit 1; fi
        env:
          BACKFILL_BATCH_SIZE: "1000"

      - name: Verify schema matches history
        run: |
          python migrations/migrate.py status
          python migrations/verify.py

      - name: Smoke test app after migration
        run: |
          curl -fsS localhost:8000/readyz
          curl -fsS -X POST localhost:8000/orders -H 'content-type: application/json' -d '{"amount": 1, "status": "shipped"}'
          psql -h localhost -U app -d app -c "SELECT count(*) AS orders, count(*) FILTER (WHERE status_id IS NULL) AS null_status_id FROM orders;"

      - name: App logs
        if: always()
        run: docker logs app || true

  # Alert rules are code too: a typo here means a silent pager.
  alerts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: docker run --rm -v "$PWD/observability:/o:ro" --entrypoint promtool prom/prometheus:v2.54.1 check rules /o/alerts.yml

  # Infrastructure as Code - validate only (no Azure account, no apply).
  iac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=terraform validate
